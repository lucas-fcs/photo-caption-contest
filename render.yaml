# Render Blueprint: the web service described as code.
# Create it in the Render dashboard with New -> Blueprint and this repository.
# The database is not here: it lives on Neon (see README, "Deployment").
services:
  - type: web
    name: photo-caption-contest
    runtime: node
    plan: free
    # Same AWS region as the Neon project (us-east-1), so queries stay in one data center.
    region: virginia
    branch: main
    # The free plan has no pre-deploy command, so migrations and seeds run in the build.
    # A failing migration fails the deploy and the previous version keeps running.
    # Seeds are tracked in the SequelizeData table, so re-running them inserts nothing twice.
    buildCommand: npm ci && npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string (direct, not pooled). Filled in the dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      # Random value generated by Render on the first deploy.
      - key: SESSION_SECRET
        generateValue: true
